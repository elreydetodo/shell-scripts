# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
#
# elreydetodo-d: angular powerline transitions, in the style of the agnoster and powerlevel10k
# themes. See docs/oh-my-posh-theme.md.
#
# The bar starts square and each segment ends in an arrow that points into the next one.

extends: elreydetodo-base.yml

blocks:
  - type: prompt
    alignment: left
    index: 1
    segments:
      - type: executiontime
        style: powerline
        powerline_symbol: ""
        foreground: p:pill-text
        background: p:prev-ok
        background_templates: &prev-background
          - "{{ if not .Executed }}p:prev-none{{ else if ne .Code 0 }}p:prev-fail{{ end }}"
      - type: status
        style: powerline
        powerline_symbol: ""
        foreground: p:pill-text
        background: p:prev-ok
        background_templates: *prev-background
      - type: time
        style: powerline
        powerline_symbol: ""
        foreground: p:pill-text
        background: p:prev-ok
        background_templates: *prev-background
      - type: git
        style: powerline
        powerline_symbol: ""
        foreground: p:pill-text
        background: p:git-clean
        background_templates:
          - "{{ if and .Working.Changed .Staging.Changed }}p:git-mixed{{ end }}"
          - "{{ if .Staging.Changed }}p:git-staged{{ end }}"
          - "{{ if .Working.Changed }}p:git-working{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:git-diverged{{ end }}"
          - "{{ if gt .Ahead 0 }}p:git-ahead{{ end }}"
          - "{{ if gt .Behind 0 }}p:git-behind{{ end }}"
