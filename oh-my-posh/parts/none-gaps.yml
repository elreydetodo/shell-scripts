# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
#
# The none-gaps shape: no backgrounds, only colored text. See ../DESIGN.md.
#
# The previous-command facts are colored by outcome and git by the state of the working tree. A dim
# │ separates the two groups.
#
# The text colors are the ink-* keys of the palette. They default to the pill colors of the same
# names, and a color set whose pills are too dark to read as text overrides them.

extends: base.yml

blocks:
  - type: prompt
    alignment: left
    index: 1
    segments:
      - type: executiontime
        foreground: p:ink-prev-ok
        foreground_templates: &prev-foreground
          - "{{ if not .Executed }}p:ink-prev-none{{ else if ne .Code 0 }}p:ink-prev-fail{{ end }}"
      - type: status
        foreground: p:ink-prev-ok
        foreground_templates: *prev-foreground
      - type: time
        foreground: p:ink-prev-ok
        foreground_templates: *prev-foreground
      - type: git
        style: diamond
        background: transparent
        leading_diamond: "<p:dim>│</>"
        foreground: p:ink-git-clean
        foreground_templates:
          - "{{ if and .Working.Changed .Staging.Changed }}p:ink-git-mixed{{ end }}"
          - "{{ if .Staging.Changed }}p:ink-git-staged{{ end }}"
          - "{{ if .Working.Changed }}p:ink-git-working{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:ink-git-diverged{{ end }}"
          - "{{ if gt .Ahead 0 }}p:ink-git-ahead{{ end }}"
          - "{{ if gt .Behind 0 }}p:ink-git-behind{{ end }}"
