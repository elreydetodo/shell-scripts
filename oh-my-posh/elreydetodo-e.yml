# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
#
# elreydetodo-e: the pills of elreydetodo-a in dark tones with pastel text. See
# docs/oh-my-posh-theme.md.
#
# Only the palette changes. Each dark background is a deep shade of the pastel it replaces.

extends: elreydetodo-a.yml

palette:
  git-ahead: "#14424A"
  git-behind: "#4A2A14"
  git-clean: "#143D2A"
  git-diverged: "#2A2F4A"
  git-mixed: "#42214A"
  git-staged: "#4A3D10"
  git-working: "#123E4A"
  pill-text: "#E6E9F5"
  prev-fail: "#5A1F24"
  prev-none: "#2A2F4A"
  prev-ok: "#24401A"
